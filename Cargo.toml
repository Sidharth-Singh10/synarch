[package]
name = "synarch"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local-first, evidence-gated multi-agent development controller"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
